- id: "research-vlm"
  title: "Shape, Seam, or Sense? Probing the Cues Vision-Language Models Use to Reassemble Natural and Biomedical Images"
  authors: "<strong>Pranav Venkateswaran</strong>"
  role: "Independent research: question, benchmark design and implementation, experiments, analysis, and writing"
  status: "Under review · AAAI-27 workshop (name withheld for double-blind review)"
  status_class: "review"
  period: "2026"
  image: "/images/projects/vlm-pieces.jpg"
  image_alt: "A natural photograph cut into interlocking jigsaw pieces, as generated by the benchmark"
  problem: >
    Jigsaw reassembly is used to test spatial reasoning in vision-language models, but natural
    photographs confound three sources of evidence: the interlocking <em>shape</em> of a piece,
    the continuity of content across the <em>seam</em>, and the <em>sense</em> of the scene. A
    model can fail because it does not perceive a cue, because it perceives the cue but does not
    use it, or because the task format hides what it knows.
  approach: >
    Manipulate one cue at a time inside the same image and the same piece geometry, so that
    differences between conditions cannot come from a change of image. Nine conditions (interlocking
    or square cuts, intact or eroded seams, upright or rotated, plus a blank shape-only condition)
    across four domains: natural photographs, H&amp;E histology, retinal OCT, and fluorescence
    microscopy. Three construction tasks, matching verification tasks, and shape probes that locate
    where a failure happens. Predictions, analysis, and a go/no-go rule were pre-registered.
  built:
    - "<strong>Puzzle generator.</strong> Cuts each 672-px crop into a 6&times;6 grid of interlocking pieces, one random knob per internal edge with a pixel-exact complementary notch, and renders every item under all nine conditions."
    - "<strong>Shape oracle.</strong> Accepts an item only if exactly one answer is consistent with piece shape, treating near-identical knob silhouettes (IoU &ge; 0.6) as interchangeable, so no ambiguous item reaches a model."
    - "<strong>Classical seam solver.</strong> A non-AI baseline that measures how much seam evidence each condition actually leaves, so a condition labelled &ldquo;seam removed&rdquo; is checked rather than assumed."
    - "<strong>Evaluation harness.</strong> Runs four open 4-12B models locally plus Gemini and GPT-5.5 references, records per-option probabilities for calibrated scoring, enforces hard API spend caps in code, and is checked by an independent audit that re-derives results from raw records."
  findings:
    - "Two validity controls changed the conclusions: with random distractors a colour-histogram matcher often solves missing-piece selection, and the open model that passed screening under those distractors falls to chance once distractors are content-matched."
    - "None of the four open models passed a full-cue check, so their cue contrasts are deliberately not interpreted. Probes show they identify tabs and blanks on an isolated piece but are at or near chance on the pieces bordering the gap."
    - "The frontier reference relies mainly on piece shape: it is at least as accurate with blank pieces as with full images, and uses seams far less than the classical solver once shape is removed."
  takeaway: "Puzzle accuracy alone does not reveal which cue a model uses."
  links: []
  note: "Manuscript and code will be posted after the review period."

- id: "research-genelab"
  title: "Explainable AI and Symbolic Regression Identify Genetic Targets for Restoring Perturbed Arabidopsis Root Stem Cell Development Under Microgravity"
  authors: "ArabidOMICS team, NASA GeneLab for High Schools Capstone · <strong>Pranav Venkateswaran</strong> (team lead)"
  role: "Team lead; analysis direction and deliverable coordination"
  status: "Abstract accepted · ASGSR 2026 Annual Meeting"
  status_class: "accepted"
  period: "2026"
  problem: >
    Spaceflight and microgravity perturb root stem-cell development in Arabidopsis. The goal is
    to identify which genes drive that perturbation and could be targeted to restore normal
    development.
  approach: >
    Began in the NASA GeneLab for High Schools Capstone Program with spaceflight RNA-seq (OSD-437):
    differential expression with volcano-plot analysis and DAVID/KEGG pathway enrichment to flag
    spaceflight-responsive pathways. The accepted abstract builds on this with explainable machine
    learning and symbolic regression to identify candidate genetic targets.
  findings:
    - "Presented at the NASA GeneLab for High Schools Showcase, August 2026."
    - "Accepted to the American Society for Gravitational and Space Research (ASGSR) 2026 Annual Meeting, Crystal City, VA, December 2026."
  links:
    - label: "OSD-437 dataset"
      url: "https://osdr.nasa.gov/bio/repo/data/studies/OSD-437"

- id: "research-dselect"
  title: "D-Select: Machine-Learning Peptide Design for Tuberculosis Breath Diagnostics"
  authors: "<strong>Pranav Venkateswaran</strong> and a student co-author"
  role: "Co-authored with a fellow student; independently directed"
  status: "Independent student research project"
  status_class: "project"
  period: "Summer 2026"
  problem: >
    Breath-based tuberculosis screening needs recognition elements that bind TB-associated volatile
    organic compounds while ignoring the much larger background of compounds in healthy breath, so
    raw binding affinity is the wrong objective on its own.
  approach: >
    Scores candidate peptides with an ensemble of binding-affinity predictors (PLAPT and DeepPurpose),
    then weights each predicted interaction by that compound's measured concentration in breath,
    turning affinity into a score for how well a peptide separates TB-positive from healthy profiles.
    Candidates are optimized by stochastic hill-climbing over sequence space, with ablations of each
    pipeline component.
  findings:
    - "The lead designed peptide reached ROC-AUC 0.955 on held-out synthetic patient data."
  links: []

