# Selected engineering projects. `featured: true` renders the expanded layout.
- id: "project-emercity"
  featured: true
  name: "Emercity"
  tagline: "An offline-first household emergency app that ranks who needs help first, for each hazard, with no signal."
  period: "2026"
  role: "Designer and lead developer"
  image: "/images/projects/emercity-screens.png"
  image_alt: "Three Emercity screens: the household home view, the per-hazard priority order, and active Emergency Mode"
  what: >
    Tells a household what to do first in a power outage, winter storm, flood, fire, chemical
    spill, or hurricane, ranked by who in that specific home is most at risk. Built for the
    Congressional App Challenge.
  built:
    - "<strong>Deterministic safety logic.</strong> The priority engine, countdowns, and emergency playbooks are pure rule-based functions with injectable clocks. No generative model makes any emergency decision, so every ranking can be explained to the user and tested against fixtures."
    - "<strong>Local-first persistence.</strong> Every write lands in an encrypted SQLite database (SQLCipher, key in the device keychain) before anything touches the network, so the app is fully usable offline."
    - "<strong>Transactional sync queue.</strong> Each shared-household write appends to a <code>sync_queue</code> table in the same transaction and drains to Firestore when connectivity returns, so offline edits are never lost and members' phones stay in sync during an emergency."
    - "<strong>Access control.</strong> Firestore security rules limit each household's data to its members, by role."
    - "<strong>Sourced safety data.</strong> Medication and food safe-time countdowns come only from cited sources (FDA, USDA, product labels) or the user's own estimate. With no sourced rule, the app says &ldquo;no safe-time data&rdquo; instead of guessing."
  rigor: >
    462 unit tests across 35 suites, including the priority engine against 46 fixture households,
    plus a separate Firestore rules suite on the emulator; TypeScript runs in strict mode. A
    progress log marks every screen as verified, verified with a stated gap, or blocked.
  stack: ["React Native", "Expo", "TypeScript (strict)", "SQLCipher", "Firebase Auth & Firestore", "Zustand", "MapLibre", "Jest"]
  limits: "The emergency rules have not yet been reviewed by a qualified professional, and the app says so. Background push alerts need server code beyond Firebase's free tier, and the app states that rather than implying it is monitoring."
  links:
    - label: "Code"
      url: "https://github.com/pranavvenkat23/emercity"
    - label: "Architecture notes"
      url: "/projects/emercity/"

- id: "project-finance-digest"
  featured: true
  name: "Finance Digest"
  tagline: "A civic-finance app that itemises your federal income tax across the real federal budget, then maps the federal money flowing back into your ZIP code."
  period: "2026"
  role: "Sole developer"
  what: >
    Enter an income, filing status, and ZIP code to get a personal federal tax receipt, a map of
    federal awards nearby, and a what-if budget simulator. Submitted to the Congressional App
    Challenge; every dollar figure traces to an official federal source.
  built:
    - "<strong>One allocation engine.</strong> The tax receipt and the simulator call the same pure module. Federal income tax is computed from IRS brackets and the standard deduction, then split across budget functions in proportion to real Treasury outlays, so line items sum exactly to the computed tax."
    - "<strong>Invariant-preserving simulation.</strong> Moving money between budget categories conserves the total exactly, so the simulator cannot create or destroy dollars; the unit tests assert this."
    - "<strong>Verified data snapshot.</strong> A refresh script pulls Monthly Treasury Statement Table 9, checks that the budget functions sum to the published total, and commits the result, so the tax views run fully offline."
    - "<strong>Cached spatial queries.</strong> USAspending.gov lookups are cached per ZIP code for 7 days, with committed sample data as a fallback so a fresh clone runs without network access or keys."
  rigor: >
    Unit tests cover bracket arithmetic, allocation proportions, and the reallocation invariant,
    under strict TypeScript. Generated explanatory text is labelled educational and never supplies
    a dollar figure; those come only from the Treasury snapshot and the tax engine.
  stack: ["React Native", "Expo Router", "TypeScript (strict)", "Zustand", "Jest", "Treasury Fiscal Data API", "USAspending.gov", "Census ZCTA"]
  links:
    - label: "Code"
      url: "https://github.com/pranavvenkat23/Finance-Digest"

- id: "project-puzzlebench"
  featured: false
  name: "Jigsaw cue benchmark"
  tagline: "The evaluation harness behind the vision-language model study: puzzle generation, a shape oracle, a classical seam solver, and multi-model runners."
  period: "2026"
  role: "Sole developer"
  what: >
    Python package that cuts an image into interlocking pieces where each hole matches its
    neighbour's tab, renders nine cue conditions per item, builds four question types, and runs
    them against local and API vision-language models with per-option probabilities recorded.
  built:
    - "A shape oracle that proves each generated puzzle has exactly one valid solution, counting near-identical knobs as interchangeable above an IoU threshold, so an unsolvable or ambiguous item never reaches a model."
    - "A classical seam solver that measures how much the image content alone carries, giving a non-AI baseline for every condition."
    - "Model runners with hard spend caps enforced in code against a global ledger, plus an independent audit script that re-derives the reported numbers from raw records without reusing the analysis code."
  stack: ["Python", "MLX", "NumPy", "SciPy", "pandas", "Pillow", "Matplotlib"]
  links:
    - label: "Research entry"
      url: "#research-vlm"

