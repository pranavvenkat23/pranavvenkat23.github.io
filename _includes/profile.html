{%- assign a = site.author -%}
<aside class="profile" aria-label="Profile">
  <div class="profile__inner">
    <img class="profile__avatar" src="{{ a.avatar | relative_url }}" alt="{{ a.avatar_alt }}" width="540" height="616">

    <div class="profile__identity">
      <h1 class="profile__name">{{ a.name }}</h1>
      <p class="profile__affiliation">{{ a.affiliation }}</p>
      <p class="profile__tagline">{{ a.tagline }}</p>
    </div>

    <ul class="profile__links">
      <li>
        <svg aria-hidden="true" viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M1.5 3h13a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5Zm.9 1L8 8.1 13.6 4H2.4ZM14 5.2l-5.7 4.2a.5.5 0 0 1-.6 0L2 5.2V12h12V5.2Z"/></svg>
        <a href="mailto:{{ a.email }}">{{ a.email }}</a>
      </li>
      <li>
        <svg aria-hidden="true" viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M1.5 3h13a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5Zm.9 1L8 8.1 13.6 4H2.4ZM14 5.2l-5.7 4.2a.5.5 0 0 1-.6 0L2 5.2V12h12V5.2Z"/></svg>
        <a href="mailto:{{ a.school_email }}">{{ a.school_email }}</a>
      </li>
      <li>
        <svg aria-hidden="true" viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M8 0C3.6 0 0 3.6 0 8c0 3.5 2.3 6.5 5.5 7.6.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.4.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-3.9 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8.6-.2 1.3-.3 2-.3s1.4.1 2 .3c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3-1.8 3.7-3.6 3.9.3.3.5.8.5 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 0Z"/></svg>
        <a href="https://github.com/{{ a.github }}">GitHub</a>
      </li>
      <li>
        <svg aria-hidden="true" viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M3.4 1.3a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM1.9 6h3v8.7h-3V6Zm4.9 0h2.9v1.2h.1c.4-.8 1.4-1.5 2.8-1.5 3 0 3.5 1.9 3.5 4.4v4.6h-3v-4c0-1 0-2.2-1.4-2.2-1.4 0-1.6 1-1.6 2.1v4.1h-3V6Z"/></svg>
        <a href="https://www.linkedin.com/in/{{ a.linkedin }}">LinkedIn</a>
      </li>
      <li>
        <svg aria-hidden="true" viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM5.1 12.2H3.9V5.6h1.2v6.6ZM4.5 4.9a.8.8 0 1 1 0-1.5.8.8 0 0 1 0 1.5Zm7.8 5.2c-.6.7-1.5 1-2.6 1H6.9V5.6h2.8c1.1 0 2 .4 2.6 1 .6.6.9 1.4.9 2.3 0 .9-.3 1.6-.9 2.2ZM9.6 6.7H8.1v3.5h1.5c1.3 0 2.1-.7 2.1-1.8 0-1-.8-1.7-2.1-1.7Z"/></svg>
        <a href="https://orcid.org/{{ a.orcid }}">ORCID</a>
      </li>
      <li>
        <svg aria-hidden="true" viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M4 1h5.2L13 4.8V15H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1Zm5 1.2V5h2.8L9 2.2ZM5 7h6v1H5V7Zm0 2.5h6v1H5v-1ZM5 12h4v1H5v-1Z"/></svg>
        <a href="{{ a.resume | relative_url }}">Resume (PDF)</a>
      </li>
      <li class="profile__location">
        <svg aria-hidden="true" viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M8 1a4.6 4.6 0 0 0-4.6 4.6C3.4 9.2 8 15 8 15s4.6-5.8 4.6-9.4A4.6 4.6 0 0 0 8 1Zm0 6.3a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4Z"/></svg>
        <span>{{ a.location }}</span>
      </li>
    </ul>
  </div>
</aside>
